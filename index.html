<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Team Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Passcode Screen (PIN: 7730) -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>Content Team Portal</h2>
      <p>Enter 4-digit passcode</p>

      <div class="pin-dots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <div class="keypad">
        <button class="key-btn" data-val="1">1</button>
        <button class="key-btn" data-val="2">2</button>
        <button class="key-btn" data-val="3">3</button>
        <button class="key-btn" data-val="4">4</button>
        <button class="key-btn" data-val="5">5</button>
        <button class="key-btn" data-val="6">6</button>
        <button class="key-btn" data-val="7">7</button>
        <button class="key-btn" data-val="8">8</button>
        <button class="key-btn" data-val="9">9</button>
        <button class="key-btn action-btn" data-val="clear">Clear</button>
        <button class="key-btn" data-val="0">0</button>
        <button class="key-btn action-btn" data-val="back">⌫</button>
      </div>

      <div class="lock-feedback" id="lockFeedback"></div>
      <p style="font-size:0.75rem; color:#9ca3af; margin-top:0.75rem;">PIN: <strong>7730</strong></p>
    </div>
  </div>

  <!-- Header -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="brand-title">Content Operations Portal (Q4 2026)</div>

      <div class="main-tab-btns">
        <button class="tab-btn active" data-tab="roster" id="tabBtnRoster">📅 Roster Plan</button>
        <button class="tab-btn" data-tab="productivity" id="tabBtnProductivity">📊 Productivity</button>
        <button class="tab-btn" data-tab="category" id="tabBtnCategory">📂 Category Wise Date</button>
      </div>

      <div class="nav-actions">
        <span style="font-size:0.75rem; color:#6b7280;">Auto-sync in <strong id="syncCountdown">5:00</strong></span>
        <button class="btn-action" id="btnSync">Sync Now</button>
        <button class="btn-action" id="btnLock">Lock</button>
      </div>
    </div>
  </header>

  <!-- Page Container -->
  <main class="page-container">

    <!-- =====================================================================
         TAB 1: ROSTER PLAN
         ===================================================================== -->
    <section id="sectionRoster">
      
      <!-- Week Summary -->
      <div class="simple-banner" id="dutyBanner"></div>

      <!-- Daily Night Shift Box (Rotated Day-by-Day across 5 members) -->
      <div style="margin-bottom:0.75rem;">
        <div style="font-size:0.82rem; font-weight:700; margin-bottom:0.4rem; display:flex; justify-content:space-between;">
          <span>🌙 Night Shift Schedule (Monday – Sunday)</span>
          <span style="font-size:0.75rem; font-weight:normal; color:#6b7280;">Rotated daily across the 5 News team members</span>
        </div>
        <div class="night-row" id="nightShiftRow"></div>
      </div>

      <!-- Sub Bar -->
      <div class="sub-bar">
        <div style="display:flex; align-items:center; gap:0.4rem;">
          <label style="font-size:0.8rem; font-weight:600;">Week:</label>
          <select class="select-simple" id="weekSelect"></select>
          <select class="select-simple" id="teamFilter">
            <option value="all">All Teams</option>
            <option value="teamA">Team A</option>
            <option value="teamB">Team B (with Trishala)</option>
          </select>
        </div>

        <div style="display:flex; align-items:center; gap:0.4rem;">
          <input type="text" class="input-simple" id="rosterSearch" placeholder="Search member...">
          <button class="btn-action" id="btnToggleMatrix">Switch to 13-Week Grid</button>
          <button class="btn-action" id="btnExportRoster">Export CSV</button>
        </div>
      </div>

      <!-- Weekly Roster Table -->
      <div class="table-wrap" id="weekTableWrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:200px;">Team Member</th>
              <th style="width:120px;">Team</th>
              <th>Assigned Work</th>
              <th>Night Shift Days</th>
            </tr>
          </thead>
          <tbody id="weekTableBody"></tbody>
        </table>
      </div>

      <!-- Full Master 13-Week Grid (Toggleable) -->
      <div class="table-wrap" id="matrixTableWrap" style="display:none;">
        <table class="data-table" id="matrixTable"></table>
      </div>

      <!-- Mentors & Prep Team -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; font-size:0.8rem;">
        <div class="table-wrap" style="padding:0.75rem;">
          <div style="font-weight:700; margin-bottom:0.5rem;">Category Mentors</div>
          <div id="mentorsList" style="display:grid; grid-template-columns:1fr 1fr; gap:0.35rem;"></div>
        </div>

        <div class="table-wrap" style="padding:0.75rem;">
          <div style="font-weight:700; margin-bottom:0.5rem;">Exam Prep Specialists</div>
          <div id="prepList" style="display:grid; grid-template-columns:1fr 1fr; gap:0.35rem;"></div>
        </div>
      </div>
    </section>

    <!-- =====================================================================
         TAB 2: PRODUCTIVITY (Default: Weekly View)
         ===================================================================== -->
    <section id="sectionProductivity" style="display:none;">
      
      <!-- Summary KPI Cards -->
      <div class="kpi-cards" id="prodKpiCards"></div>

      <!-- Sub-tabs (Default: Daily) -->
      <div class="sub-bar">
        <div class="sub-btns">
          <button class="sub-btn active" data-subtab="daily" id="subtabDaily">Daily Output</button>
          <button class="sub-btn" data-subtab="weekly" id="subtabWeekly">Last 7 Days</button>
          <button class="sub-btn" data-subtab="monthly" id="subtabMonthly">Monthly Output</button>
        </div>

        <input type="text" class="input-simple" id="prodSearch" placeholder="Search writer...">
      </div>

      <div class="table-wrap" id="prodTableContainer"></div>
    </section>

    <!-- =====================================================================
         TAB 3: CATEGORY WISE DATE (Categories in Columns)
         ===================================================================== -->
    <section id="sectionCategory" style="display:none;">
      
      <div class="sub-bar">
        <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
          <label style="font-size:0.8rem; font-weight:600;">Filter:</label>
          <select class="select-simple" id="catMonthFilter">
            <option value="all">All Months (Apr - Oct 2026)</option>
            <option value="04">April 2026</option>
            <option value="05">May 2026</option>
            <option value="06">June 2026</option>
            <option value="07">July 2026</option>
            <option value="08">August 2026</option>
            <option value="09">September 2026</option>
            <option value="10">October 2026</option>
          </select>
          <input type="text" class="input-simple" id="catSearch" placeholder="Search date (e.g. 04/01, 09/15)..." style="width:220px;">
          <span id="catStatsLabel" style="font-size:0.75rem; color:#6b7280; font-weight:500;"></span>
        </div>

        <button class="btn-action" id="btnExportCategoryCSV">Export CSV</button>
      </div>

      <div class="table-wrap" style="max-height: 680px; overflow: auto;">
        <table class="data-table" id="catGridTable">
          <thead id="catGridHead"></thead>
          <tbody id="catGridBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Data & Application Logic -->
  <script src="roster-data.js"></script>
  <script src="sheets-data.js"></script>
  <script src="category-data.js"></script>
  <script src="sheets-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
